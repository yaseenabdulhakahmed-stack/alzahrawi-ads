<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C9A227">
<title>الزهراوي للإعلانات — لوحة الإدارة</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
  body{background:#f0f2f5;padding:16px}
  .container{max-width:600px;margin:0 auto}
  .card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-top:4px solid #C9A227}
  h1{color:#075E54;margin-bottom:20px;text-align:center;font-size:22px}
  h1 span{color:#C9A227}
  h2{color:#128C7E;margin-bottom:12px;font-size:17px}
  input,textarea,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd;font-size:15px;font-family:inherit}
  input[type="file"]{background:#f9f9f9; cursor:pointer;}
  textarea{min-height:80px;resize:vertical}
  button{background:#C9A227;color:#fff;border:none;font-weight:bold;cursor:pointer}
  button:hover{background:#a8861f}
  button.danger{background:#e74c3c}
  button.danger:hover{background:#c0392b}
  button.share{background:#25D366}
  button.share:hover{background:#128C7E}
  button.copy{background:#075E54}
  button.edit{background:#3498db}
  .ad-item{background:#f9f9f9;padding:12px;border-radius:8px;margin-bottom:10px;border-right:4px solid #C9A227}
  .ad-item h3{color:#075E54;margin-bottom:4px;font-size:16px}
  .ad-item p{color:#666;font-size:13px;margin-bottom:8px;word-break:break-all}
  .ad-actions{display:flex;gap:6px;flex-wrap:wrap}
  .ad-actions button{padding:8px;font-size:13px;margin:0;flex:1;min-width:70px}
  .hidden{display:none!important}
  .msg{padding:10px;border-radius:8px;margin:8px 0;text-align:center;font-size:14px}
  .msg.success{background:#d4edda;color:#155724}
  .msg.error{background:#f8d7da;color:#721c24}
  .signature{text-align:center;color:#C9A227;font-size:12px;margin-top:20px;font-weight:bold}
  .password-wrapper { position: relative; margin: 8px 0; }
  .password-wrapper input { margin: 0; padding-left: 40px; }
  .eye-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 20px; opacity: 0.6; }
</style>
</head>
<body>
<div class="container">

  <div id="login" class="card">
    <h1>🔐 <span>الزهراوي</span> للإعلانات</h1>
    <p style="color:#666;margin-bottom:12px;text-align:center">أدخل كلمة السر</p>
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="كلمة السر">
      <span class="eye-icon" onclick="togglePassword()">👁️</span>
    </div>
    <button onclick="doLogin()">دخول</button>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h1>📢 <span>الزهراوي</span> للإعلانات</h1>
      <h2 id="formTitle">➕ إعلان جديد</h2>
      <input type="text" id="title" placeholder="عنوان الإعلان (مثال: متجر أحمد للعطور)">
      <textarea id="desc" placeholder="وصف الإعلان"></textarea>
      <input type="text" id="price" placeholder="السعر (بالريال السعودي - اختياري)">
      <input type="url" id="link" placeholder="رابط التواصل (https://wa.me/967... أو https://maps...)">
      
      <label style="font-size:14px;color:#555;margin-top:8px;display:block">📸 اختر صور الإعلان (حتى 3 صور):</label>
      <input type="file" id="imageFiles" accept="image/*" multiple>

      <label style="font-size:14px;color:#555;margin-top:8px;display:block">📄 رابط ملف PDF أو وورد (اختياري):</label>
   <textarea id="documentLink" placeholder="ضع رابطاً في كل سطر، مثال:&#10;https://drive.google.com/link1&#10;https://drive.google.com/link2" style="min-height: 80px;"></textarea>
      <small style="color:#888; font-size:12px; display:block; margin-bottom:8px;">ارفع ملفك على جوجل درايف أو أي مركز ملفات وضع الرابط هنا.</small>
      
      <button id="saveBtn" onclick="saveAd()">💾 حفظ الإعلان</button>
      <button id="cancelBtn" class="danger hidden" onclick="cancelEdit()" style="margin-top:4px">❌ إلغاء التعديل</button>
      <div id="msg"></div>
    </div>

    <div class="card">
      <h2>📋 إعلاناتي (<span id="count">0</span>)</h2>
      <div id="list"></div>
    </div>
    <p class="signature">✦ الزهراوي للإعلانات ✦</p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { firebaseConfig, ADMIN_PASSWORD, APP_URL } from './config.js';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let editId = null;
let allAds = [];

window.togglePassword = function() {
  const pwdInput = document.getElementById('password');
  const icon = document.querySelector('.eye-icon');
  if (pwdInput.type === 'password') { pwdInput.type = 'text'; icon.style.opacity = '1'; }
  else { pwdInput.type = 'password'; icon.style.opacity = '0.6'; }
};

window.doLogin = function() {
  if (document.getElementById('password').value === ADMIN_PASSWORD) {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadAds();
  } else { alert('كلمة السر خاطئة'); }
};

// دالة ضغط الصور (Base64) - تعمل بشكل ممتاز
function compressImage(file) {
  return new Promise((resolve) => {
    if (!file) { resolve(""); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width; let height = img.height;
        if (width > 400) { height = Math.round((height * 400) / width); width = 400; }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.6)); 
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

window.saveAd = async function() {
  const title = document.getElementById('title').value.trim();
  const imageFiles = document.getElementById('imageFiles').files;
  const docLink = document.getElementById('documentLink').value.trim();
  
  if (!title) { showMsg('العنوان مطلوب', 'error'); return; }
  showMsg('⏳ جاري معالجة الصور وحفظ الإعلان...', 'success');

  try {
    let imagesArray = [];
    
    // معالجة الصور
    for (let i = 0; i < Math.min(imageFiles.length, 3); i++) {
      const imgData = await compressImage(imageFiles[i]);
      imagesArray.push(imgData);
    }

    // الحفاظ على الصور القديمة أثناء التعديل
    if (editId && imageFiles.length === 0) {
      const oldAd = allAds.find(a => a.id === editId);
      imagesArray = oldAd.images || (oldAd.image ? [oldAd.image] : []);
    }

    // تجهيز رابط المستند (إذا وجد)
       ```javascript
   let docsArray = [];
   if (docLink) {
     // تقسيم الروابط بناءً على السطر الجديد
     const links = docLink.split('\n');
     let fileCounter = 1;
     links.forEach(link => {
       if(link.trim() !== "") {
         docsArray.push({ name: `📄 تحميل الملف ${fileCounter}`, url: link.trim() });
         fileCounter++;
       }
     });
   }
   ```
    }

    const adData = {
      title: title,
      desc: document.getElementById('desc').value.trim(),
      price: document.getElementById('price').value.trim(),
      link: document.getElementById('link').value.trim(),
      images: imagesArray,
      documents: docsArray,
      image: imagesArray.length > 0 ? imagesArray[0] : ""
    };

    if (editId) {
      await updateDoc(doc(db, 'ads', editId), adData);
      showMsg('✅ تم تحديث الإعلان بنجاح', 'success');
      cancelEdit();
    } else {
      adData.createdAt = serverTimestamp();
      await addDoc(collection(db, 'ads'), adData);
      showMsg('✅ تم حفظ الإعلان بنجاح', 'success');
      ['title','desc','price','link','documentLink'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('imageFiles').value = '';
    }
    
    loadAds();
  } catch(e) { 
    showMsg('خطأ: ' + e.message, 'error'); 
  }
};

window.editAd = function(id) {
  const ad = allAds.find(a => a.id === id);
  if (!ad) return;
  document.getElementById('title').value = ad.title;
  document.getElementById('desc').value = ad.desc || '';
  document.getElementById('price').value = ad.price || '';
  document.getElementById('link').value = ad.link || '';
  
  if(ad.documents && ad.documents.length > 0) {
     document.getElementById('documentLink').value = ad.documents[0].url;
  } else {
     document.getElementById('documentLink').value = '';
  }

  editId = id;
  document.getElementById('formTitle').innerText = "✏️ تعديل الإعلان";
  document.getElementById('saveBtn').innerText = "💾 تحديث الإعلان";
  document.getElementById('cancelBtn').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.cancelEdit = function() {
  editId = null;
  document.getElementById('formTitle').innerText = "➕ إعلان جديد";
  document.getElementById('saveBtn').innerText = "💾 حفظ الإعلان";
  document.getElementById('cancelBtn').classList.add('hidden');
  ['title','desc','price','link','documentLink'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('imageFiles').value = '';
};

async function loadAds() {
  const snap = await getDocs(collection(db, 'ads'));
  allAds = [];
  snap.forEach(d => allAds.push({ id: d.id, ...d.data() }));
  allAds.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  document.getElementById('count').textContent = allAds.length;
  
  const list = document.getElementById('list');
  if (!allAds.length) { list.innerHTML = '<p style="color:#999;text-align:center">لا توجد إعلانات بعد</p>'; return; }
  
  list.innerHTML = allAds.map(ad => `
    <div class="ad-item">
      <h3>${esc(ad.title)}</h3>
      <p>${esc(ad.desc||'')}</p>
      <div class="ad-actions">
        <button class="edit" onclick="editAd('${ad.id}')">✏️ تعديل</button>
        <button class="share" onclick="shareAd('${ad.id}')">📤 مشاركة</button>
        <button class="copy" onclick="copyLink('${ad.id}')">🔗 نسخ</button>
        <button class="danger" onclick="delAd('${ad.id}')">🗑️ حذف</button>
      </div>
    </div>`).join('');
}

window.shareAd = function(id) {
  const url = `${APP_URL}/ad.html?id=${id}`;
  const text = `هل عليكي التزامات جامعية :\n${url}`;
  if (navigator.share) navigator.share({ text, url }).catch(()=>{});
  else window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
};

window.copyLink = function(id) {
  navigator.clipboard.writeText(`${APP_URL}/ad.html?id=${id}`).then(() => alert('تم نسخ الرابط'));
};

window.delAd = async function(id) {
  if (!confirm('تأكيد حذف الإعلان نهائيًا؟')) return;
  try { await deleteDoc(doc(db, 'ads', id)); loadAds(); }
  catch(e) { alert('خطأ: ' + e.message); }
};

function showMsg(t, type) {
  const el = document.getElementById('msg');
  el.className = 'msg ' + type; el.textContent = t;
  setTimeout(() => { el.className = ''; el.textContent = ''; }, 6000);
}
function esc(s) { return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
</body>
</html>
