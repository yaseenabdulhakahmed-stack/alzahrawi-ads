<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C9A227">
<title>الزهراوي للإعلانات</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
  body{background:linear-gradient(135deg,#075E54,#128C7E);min-height:100vh;padding:16px;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:16px;padding:30px;max-width:95%;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);border-top:8px solid #C9A227;margin: auto}
  .gallery { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 16px; padding-bottom: 5px; scroll-snap-type: x mandatory; }
  .gallery img { height: 200px; border-radius: 12px; object-fit: cover; scroll-snap-align: start; flex-shrink: 0;}
  h1{color:#075E54;margin-bottom:12px;font-size:22px}
  .cat-badge { display:inline-block; background:#3498db; color:#fff; padding:4px 12px; border-radius:20px; font-size:14px; margin-bottom:12px; font-weight:bold;}
  .price{color:#C9A227;font-weight:bold;font-size:22px;margin:12px 0;text-align:center;background:#fef9e7;padding:10px;border-radius:8px}
  .desc{color:#333;line-height:1.7;margin:12px 0;white-space:pre-wrap}
  
  .btn{display:block;text-align:center;padding:14px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:16px;background:#25D366;color:#fff; font-size:16px;}
  .btn:hover{background:#128C7E}
  
  .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
  .cat-link { display: block; background: #f0f2f5; color: #075E54; text-align: center; padding: 12px 5px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; border: 1px solid #ddd; transition: 0.3s; }
  .cat-link:hover { background: #25D366; color: #fff; }
  .section-title { text-align: center; color: #555; font-size: 14px; margin-top: 25px; margin-bottom: 10px; border-top: 1px dashed #ccc; padding-top: 15px;}

  .files-section { margin-top: 16px; border-top: 1px solid #eee; padding-top: 16px; }
  .files-section h3 { font-size: 16px; color: #333; margin-bottom: 8px; }
  .file-link { display: block; background: #f4f4f4; color: #333; text-decoration: none; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; border: 1px solid #ddd; text-align: center;}
  .file-link:hover { background: #e0e0e0; }
  
  .error{text-align:center;padding:40px 20px}
  .error h1{color:#e74c3c}
  .signature{text-align:center;color:#C9A227;font-size:12px;margin-top:20px;font-weight:bold}
  .loading{color:#fff;font-size:18px;text-align:center}
</style>
</head>
<body>
<div id="content"><div class="loading">⏳ جاري التحميل...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { firebaseConfig } from './config.js';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const id = new URLSearchParams(location.search).get('id');
const content = document.getElementById('content');

const MY_PHONE = "966577862430"; 

const allCategories = [
  "📝 اختبارات", "📚 واجبات", "📁 سكاليف", "🎓 مشاريع تخرج", 
  "🔍 بحوثات", "📊 عروض تقديمية", "📄 تقارير", "📋 استبيانات", 
  "🎨 تصاميم", "🎬 فيديوهات", "💼 خدمات أخرى"
];

if (!id) {
  content.innerHTML = '<div class="card error"><h1>❌ رابط غير صالح</h1><p style="margin-top:12px;color:#666">لم يتم تحديد إعلان</p></div>';
} else {
  loadAd();
}

async function loadAd() {
  try {
    const docRef = doc(db, 'ads', id);
    const snap = await getDoc(docRef);
    
    if (!snap.exists()) {
      content.innerHTML = '<div class="card error"><h1>🚫 هذا الإعلان لم يعد متاحًا</h1><p style="margin-top:12px;color:#666">قد يكون صاحبه حذفه</p><p class="signature">✦ الزهراوي للإعلانات ✦</p></div>';
      return;
    }

    updateDoc(docRef, { views: increment(1) }).catch(() => {});

    const ad = snap.data();
    
    let imagesHtml = "";
    if (ad.images && ad.images.length > 0) {
      imagesHtml = `<div class="gallery">${ad.images.map(img => `<img src="${img}" alt="صورة الإعلان">`).join('')}</div>`;
    } else if (ad.image) {
      imagesHtml = `<div class="gallery"><img src="${ad.image}" alt="صورة الإعلان"></div>`;
    }

    let filesHtml = "";
    if (ad.documents && ad.documents.length > 0) {
      filesHtml = `<div class="files-section">
        <h3>📎 المرفقات (اضغط للتحميل):</h3>
        ${ad.documents.map(f => `<a href="${f.url}" target="_blank" class="file-link">${esc(f.name)}</a>`).join('')}
      </div>`;
    }

    let categoriesHtml = `<div class="categories-grid">
      ${allCategories.map(cat => `<a href="https://wa.me/${MY_PHONE}?text=${encodeURIComponent('مرحباً، أريد خدمة ' + cat)}" class="cat-link" target="_blank">${cat}</a>`).join('')}
    </div>`;

    const currentCategory = ad.category || '⭐ شامل (كل الخدمات)';
    
    // التحقق مما إذا كان الإعلان شاملاً أم قسماً محدداً
    let mainBtnText = "📞 اطلب هذا القسم الآن";
    let mainMsg = 'مرحباً، أريد خدمة ' + currentCategory;
    
    if (currentCategory.includes("شامل")) {
      mainBtnText = "📞 تواصل معنا الآن للطلب";
      mainMsg = 'مرحباً، أريد الاستفسار عن خدماتكم الأكاديمية';
    }

    const mainWhatsappLink = `https://wa.me/${MY_PHONE}?text=${encodeURIComponent(mainMsg)}`;

    content.innerHTML = `<div class="card">
      ${imagesHtml}
      <span class="cat-badge">${esc(currentCategory)}</span>
      <h1>${esc(ad.title)}</h1>
      ${ad.price ? `<div class="price">💰 ${esc(ad.price)} ر.س</div>` : ''}
      <div class="desc">${esc(ad.desc||'')}</div>
      ${filesHtml}
      
      <a href="${mainWhatsappLink}" class="btn" target="_blank">${mainBtnText}</a>
      
      <div class="section-title">👇 أو اختر خدمة أخرى للتواصل المباشر 👇</div>
      ${categoriesHtml}

      <p class="signature">✦ الزهراوي للإعلانات ✦</p>
    </div>`;
  } catch(e) {
    content.innerHTML = '<div class="card error"><h1>خطأ</h1><p>'+esc(e.message)+'</p></div>';
  }
}
function esc(s) { return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
</body>
</html>
